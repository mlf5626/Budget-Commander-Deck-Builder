<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title | default("Page Not Found") }} | Budget Commander Deck Builder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}?v=2">
  <style>
    body { background-color: #101827; color: #f8fafc; min-height: 100vh; }
    .navbar { background-color: #172238; border-bottom: 1px solid #334155; }
    .navbar-brand { color: white; font-weight: bold; }
    .error-panel { background: #1e293b; border: 1px solid #475569; border-radius: 16px; padding: 40px; max-width: 650px; margin: 90px auto; }
    .highlight { color: #a78bfa; }
    .btn-purple { background: #7c3aed; border-color: #7c3aed; color: white; font-weight: 600; }
    .btn-purple:hover { background: #6d28d9; border-color: #6d28d9; color: white; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand" href="{{ url_for('home') }}">Budget Commander Deck Builder</a></div></nav>
  <main class="container">
    <section class="error-panel text-center" role="alert">
      <h1 class="highlight fw-bold mb-3">{{ title | default("Page Not Found") }}</h1>
      <p class="fs-5 mb-4">{{ message }}</p>
      <a class="btn btn-purple btn-lg" href="{{ return_url | default(url_for('home')) }}">{{ return_label | default("Return to Homepage") }}</a>
    </section>
  </main>
  <footer class="text-center py-4" style="color:#cbd5e1">IST 440W Capstone Project</footer>
</body>
</html>
