<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Budget Commander Deck Builder</title>
</head>
<body>
	<h1>Budget Commander Deck Builder</h1>
	<p>Build a Commander deck that fits your playstyle and your budget.</p>

	<h2>Choose Your Commander</h2>
	<form action="/search" method="POST">
		<label for="commander">Commander Name:</label>
		<input
			type="text"
			id="commander"
			name="commander"
			placeholder="Enter a commander name"
		>
		<button type="submit">Search</button>
	</form>
</body>
</html>
